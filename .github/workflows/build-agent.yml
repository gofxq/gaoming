name: build-agent

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-agent.yml"
      - "agent/**"
      - "pkg/**"
      - "deployments/install-agent*"
      - "deployments/uninstall-agent*"
      - "deployments/tests/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-installers:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test Unix installer
        if: runner.os != 'Windows'
        run: make test-agent-installers
      - name: Test Windows PowerShell 5.1 installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./deployments/tests/install-agent.Tests.ps1
      - name: Test PowerShell 7 installer
        shell: pwsh
        run: ./deployments/tests/install-agent.Tests.ps1

  build-agent:
    needs: test-installers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build agent archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build_tar() {
            goos="$1"
            goarch="$2"
            name="gaoming-agent_${goos}_${goarch}"
            out_dir="dist/${name}"
            mkdir -p "${out_dir}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${out_dir}/gaoming-agent" \
              ./agent
            tar -C "${out_dir}" -czf "dist/${name}.tar.gz" gaoming-agent
            rm -rf "${out_dir}"
          }

          build_zip() {
            goos="$1"
            goarch="$2"
            name="gaoming-agent_${goos}_${goarch}"
            out_dir="dist/${name}"
            mkdir -p "${out_dir}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${out_dir}/gaoming-agent.exe" \
              ./agent
            (cd "${out_dir}" && zip -q "../${name}.zip" "gaoming-agent.exe")
            rm -rf "${out_dir}"
          }

          build_tar linux amd64
          build_tar linux arm64
          build_tar darwin amd64
          build_tar darwin arm64
          build_zip windows amd64
          build_zip windows arm64

          cp deployments/install-agent.sh deployments/install-agent.ps1 deployments/uninstall-agent.sh deployments/uninstall-agent.ps1 dist/
          sha256sum dist/gaoming-agent_* dist/install-agent.* dist/uninstall-agent.* > dist/checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaoming-agent-release-assets
          path: dist/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gaoming-agent_linux_amd64.tar.gz
            dist/gaoming-agent_linux_arm64.tar.gz
            dist/gaoming-agent_darwin_amd64.tar.gz
            dist/gaoming-agent_darwin_arm64.tar.gz
            dist/gaoming-agent_windows_amd64.zip
            dist/gaoming-agent_windows_arm64.zip
            dist/install-agent.sh
            dist/install-agent.ps1
            dist/uninstall-agent.sh
            dist/uninstall-agent.ps1
            dist/checksums.txt
          generate_release_notes: true
