services:
  postgres:
    image: postgres:16-alpine
    container_name: gaoming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaoming
      POSTGRES_USER: gaoming
      POSTGRES_PASSWORD: gaoming
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-35432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U gaoming -d gaoming" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gaoming-redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:${REDIS_PORT:-36379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    container_name: gaoming-server
    restart: unless-stopped
    environment:
      GAOMING_SETUP_TOKEN: ${GAOMING_SETUP_TOKEN:-}
      GAOMING_ADMIN_PASSWORD: ${GAOMING_ADMIN_PASSWORD:-}
    volumes:
      - ./deployments/server-config.docker.yaml:/app/config/server.yml:ro
    ports:
      - "0.0.0.0:${HTTP_PORT:-8080}:8080"
      - "0.0.0.0:${GRPC_PORT:-8091}:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/master/healthz >/dev/null && wget -qO- http://127.0.0.1:8080/ingest/healthz >/dev/null && wget -qO- http://127.0.0.1:8080/ >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    profiles:
      - container-agent
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE_PATH: ./agent
      target: agent
    container_name: gaoming-agent
    restart: unless-stopped
    volumes:
      - ./deployments/agent-config.docker.yaml:/app/agent-config.yaml:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
