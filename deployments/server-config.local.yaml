# 本机开发模板；make dev-init 首次复制时替换为随机数据库和 Redis 密码。
http_addr: "0.0.0.0:9090"
grpc_addr: "0.0.0.0:9091"
runtime_backend: pg_redis
postgres_dsn: "postgres://gaoming:gaoming@127.0.0.1:5432/gaoming?sslmode=disable"
redis_addr: "127.0.0.1:6379"
redis_password: ""
redis_db: 0
# 与其他部署共用 Redis 时，设置唯一命名空间以隔离指标键和 Pub/Sub 频道。
redis_namespace: gaoming-local
tenant_code: default
tenant_name: Default Tenant
allow_custom_tenant_code: true
session_cookie_name: gaoming_session
session_ttl_hours: 168
# dev-init 为新配置生成随机一次性引导凭据；已有配置需自行设置。
setup_token: ""
# 仅用于可信本机/局域网 HTTP 联调，生产环境必须使用 Secure Cookie 和 HTTPS。
session_cookie_secure: false
allowed_origins:
  - http://127.0.0.1:5173
  - http://localhost:5173
  - http://127.0.0.1:9090
  - http://localhost:9090
probe_interval_sec: 15
# 省略 probe_target_url 时探测统一后端自己的 /master/healthz。
